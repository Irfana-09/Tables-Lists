
<!DOCTYPE html>
<html>
<head>
    <title>Tables and Lists</title>
</head>
<body>

    <table border="1">
        <tr>
            <th>Name</th>
            <th>Roll No</th>
            <th>Marks</th>
        </tr>
        <tr>
            <td>Azmat</td>
            <td>101</td>
            <td>90</td>
        </tr>
        <tr>
            <td>Ayesha</td>
            <td>102</td>
            <td>85</td>
        </tr>
    </table>

    <h2>Subjects</h2>
    <ul>
        <li>Java</li>
        <li>Python</li>
        <li>HTML</li>
    </ul>

    <h2>Daily Activities</h2>
    <ol>
        <li>Study</li>
        <li>Practice</li>
        <li>Revision</li>
    </ol>

</body>
</html>
